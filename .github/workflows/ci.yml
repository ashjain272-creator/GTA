name: ci
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install locked environment
        run: pip install uv && uv sync --locked --extra dev
      - name: Smoke tests
        run: uv run pytest -m smoke -q

  walking-skeleton:
    runs-on: ubuntu-24.04
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install locked environment with ASR extra
        run: pip install uv && uv sync --locked --extra dev --extra asr
      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-faster-whisper-base.en
      - name: Unit, integration and end-to-end tests
        run: uv run pytest -q
