# clipops settings template. Copy to config/settings.yaml (git-ignored) and edit.
# Every tunable lives here, never in code (spec 2.7 "hidden hardcoding").
# Values marked HYPOTHESIS are starting points awaiting evidence (spec 18.2 E2).

operator:
  timezone: UTC                 # ASSUMPTION A-006 until operator states it
  languages: [en]               # ASSUMPTION A-004
  weekly_review_minutes: 60     # ASSUMPTION A-007

paths:
  data_root: data               # relative to repo root; large media lives here only
  sources: data/sources
  work: data/work
  renders: data/renders
  published: data/published
  db: data/db/clipops.sqlite3   # DECISION pending (5.6 #3)

resources:
  max_heavy_jobs: 2             # HYPOTHESIS: half of logical cores on dev container
  min_free_disk_gib: 20         # job admission stops below this (R11)

rights:
  # Source classes A-F per spec 4.3. Class E and F never enter the pipeline.
  allowed_production_classes: [A, B, C, E]   # E only with an operator attestation (AM-30); monetisation forced off
  require_game_policy_record: true

acquire:                        # URL acquisition, class A/B only (AM-29)
  format: "bv*[height<=1080]+ba/b[height<=1080]"
  max_bytes_per_s: 5000000      # polite client; never evade rate limits
  sleep_between_requests_s: 1
  max_items: 25                 # cap per channel/playlist run (class A/B only)
  max_bytes: 2500000000         # direct-file download cap
  user_agent: "clipops/0.1 (open-source clipping tool)"   # generic client name; no personal details
  cookies_file_env: CLIPOPS_YOUTUBE_COOKIES_FILE   # optional: your own exported cookies (Netscape format), kept outside the repo

publishing:
  # Autonomy levels per spec 11.6. The system never raises these itself.
  default_autonomy_level: L0
  platforms:
    youtube:   { enabled: false, autonomy_level: L0 }
    tiktok:    { enabled: false, autonomy_level: L0 }
    instagram: { enabled: false, autonomy_level: L0 }
    twitch:    { enabled: false, autonomy_level: L0 }

credentials:
  # Names of environment variables only. Values are never stored in this file.
  youtube_client_secrets_file_env: CLIPOPS_YOUTUBE_CLIENT_SECRETS_FILE
  youtube_token_file_env: CLIPOPS_YOUTUBE_TOKEN_FILE
  tiktok_client_key_env: CLIPOPS_TIKTOK_CLIENT_KEY
  tiktok_client_secret_env: CLIPOPS_TIKTOK_CLIENT_SECRET
  meta_app_id_env: CLIPOPS_META_APP_ID
  meta_app_secret_env: CLIPOPS_META_APP_SECRET
  ig_user_id_env: CLIPOPS_IG_USER_ID
  twitch_client_id_env: CLIPOPS_TWITCH_CLIENT_ID
  twitch_client_secret_env: CLIPOPS_TWITCH_CLIENT_SECRET

hosted_models:
  enabled: false                # Principle 6: no paid dependency without operator consent
  monthly_ceiling_usd: 0

# ---------------------------------------------------------------- pipeline (walking skeleton)
asr:
  engine: faster-whisper        # only engine implemented; others added via Phase 1 decision 5.6 #4
  model: base.en                # HYPOTHESIS: container test only (E-013); decide on operator machine
  compute_type: int8
  device: cpu
  vad_filter: true
  language: en

models:
  yamnet:                       # Apache-2.0 (E-036); third-party mirror of Google's release, pinned by hash
    dir: data/models/yamnet
    model_url: https://huggingface.co/thelou1s/yamnet/resolve/main/lite-model_yamnet_classification_tflite_1.tflite
    model_sha256: 10c95ea3eb9a7bb4cb8bddf6feb023250381008177ac162ce169694d05c317de
    labels_url: https://huggingface.co/thelou1s/yamnet/resolve/main/labels_yamnet.txt
    labels_sha256: 7d8f037d4f496d26fa910a0381b3d47042adcb89b7706e976785b6d3943ccd59

analysis:
  loudness_window_s: 0.4        # ebur128 momentary window is fixed at 400 ms
  scene_threshold: 10.0         # scdet score threshold (0-100); HYPOTHESIS
  music_threshold: 0.30         # YAMNet "Music" score counted as music (HYPOTHESIS; calibrate on real GTA audio)
  max_music_fraction: 0.10      # candidate rejected above this share of music windows (R26; fail closed)

candidates:
  min_duration_s: 8.0           # HYPOTHESIS (spec 7.7 duration guidance to be researched)
  max_duration_s: 45.0          # keep <= 60: Shorts over 1 min with any active claim are blocked globally (E-031)
  lead_in_s: 0.6                # silence kept before first word
  tail_s: 0.8                   # reaction tail kept after last word
  max_candidates_per_source: 5
  min_viability: 0.2            # below this, a candidate is rejected (spec 7.8)
  max_internal_gap_s: 3.0       # longest pause allowed inside a clip; dead air (HYPOTHESIS)
  event_min_score: 0.3          # YAMNet impact/scream score that seeds an action candidate
  event_loudness_lu: 12.0       # loudness peak this far above the source median also seeds one
  event_cluster_gap_s: 6.0      # events closer than this form one moment
  event_pre_s: 5.0              # lead-up kept before the first event
  event_post_s: 5.0             # aftermath/reaction kept after the last event

framing:                        # smart vertical framing (editing/framing.py); all HYPOTHESIS until real footage
  noise_floor: 6.0              # per-pixel abs diff below this is ignored (0-255 scale)
  min_motion: 2.0               # per-column mean motion for a frame to count as active
  min_active_share: 0.25        # below this share of active frames → blur_fill
  min_concentration: 0.55       # median share of motion inside the 9:16 window needed to crop
  dead_zone_frac: 0.03          # ignore centre changes smaller than this (of source width)
  smoothing: 0.25               # exponential smoothing per analysis frame (10 fps)
  max_speed_frac_per_s: 0.6     # camera may move at most this share of the width per second
  cut_mean_diff: 25.0           # mean abs frame difference treated as a scene cut (reframe instantly)
  contrast_floor: 30.0          # pixel contrast vs frame median counted as "subject" when nothing moves
  third_person_follow: 0.35     # third-person games: how far the crop may follow motion away from centre
flash_mitigation:               # photosensitivity filter settings tried in order until the WCAG check passes (E-045)
  ladder: [[30, 0.5], [30, 0.35], [30, 0.2]]
caption_placement:
  bottom_band: [0.66, 0.80]     # caption band as a fraction of output height (default)
  alt_margin_top_px: 560        # alternative: captions in the upper band when the subject sits low
  subject_clearance: 0.08

edit:
  hook_duration_s: 2.6
  teaser_before_s: 0.8          # cold-open teaser: seconds before the payoff
  teaser_after_s: 0.7
  zoom_min_gap_s: 1.2
  sfx_speech_guard_s: 0.15      # an effect may not start within this distance of a spoken word

render:
  width: 1080
  height: 1920
  fps: 30
  video_codec: libx264          # software: no working HW encoder on dev host (E-010)
  crf: 20
  preset: medium
  audio_codec: aac
  audio_bitrate: 192k
  loudness_target_lufs: -14.0   # HYPOTHESIS: VERIFY platform normalisation targets (8.11)
  true_peak_dbtp: -1.5
  background: blur              # blur | black
  subtitles:
    font: DejaVu Sans
    font_size: 64
    max_words_per_cue: 4
    max_cue_s: 2.5
    min_cue_s: 0.6              # a caption stays at least this long (extends into the gap after it)
    target_cps: 17              # extend display towards this reading speed when there is room
    max_cps: 22                 # faster than this → merge with the next cue when they fit
    max_cue_chars: 34
    margin_v: 420               # px from bottom; keeps captions above platform UI (HYPOTHESIS, 8.9 VERIFY)
    margin_h: 80
    outline: 4

qa:
  duration_tolerance_s: 0.25
  loudness_tolerance_lu: 1.5
  max_black_s: 0.5
  max_silence_s: 2.0
  silence_threshold_db: -50
  contact_sheet_interval_s: 2.0
  max_flashes_per_s: 3          # WCAG 2.2 SC 2.3.1 general-flash rule (E-033); red flash not implemented
  min_caption_px: 40            # smallest acceptable rendered glyph height (HYPOTHESIS)
  safe_area:                    # pixels kept free of captions on 1080x1920 (HYPOTHESIS: platform UI overlays, VERIFY 8.9)
    top_px: 220
    bottom_px: 380
    side_px: 90
