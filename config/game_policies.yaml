rockstar:
  publisher: Rockstar Games / Take-Two Interactive
  titles: ["Grand Theft Auto V", "GTA Online", "Grand Theft Auto VI", "Red Dead Redemption 2"]
  policy_url: https://support.rockstargames.com/articles/200153756/Policy-on-posting-copyrighted-Rockstar-Games-material
